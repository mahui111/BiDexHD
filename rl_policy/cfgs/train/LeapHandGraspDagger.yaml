params:
  name: ${algo}
  log_dir: './runs' 
  policy: # only works for MlpPolicy right now
    backbone_type: 'PointNetBackbone'
    numDownsample: ${numDownsample}
    numEachPoint: ${numEachPoint}
    pcEmbDim: 128
    useSeg: False
    freeze_backbone: False
    pi_hid_sizes: [1024, 1024, 512, 512]
    vf_hid_sizes: [1024, 1024, 512, 512]
    activation: elu # can be elu, relu, selu, crelu, lrelu, tanh, sigmoid

  test: ${...test}
  checkpoint: ${...checkpoint}
  resume: 0
  # check for potential saves every this many iterations
  save_interval: 500
  print_log: True

  # rollout params
  max_iterations: 1000000

  # training params
  cliprange: 0.2
  ent_coef: 0.0001
  nsteps: 8
  noptepochs: 5
  nminibatches: 4 # this is per agent
  max_grad_norm: 1
  optim_stepsize: 3.e-4 # 3e-4 is default for single agent training with constant schedule
  schedule: adaptive # could be adaptive or linear or fixed
  desired_kl: 0.016
  gamma: 0.96
  lam: 0.95
  init_noise_std: 0.8

  log_interval: 1
  asymmetric: False

  value_loss:
    apply: True
    use_clipped_value_loss: True
    value_loss_coef: 0.1
    clip_range: 0.5

  expert: [
    {
      name: '0',
      path: '/home/zbh/Desktop/zbh/robot/BVDex/rl_policy/runs/(pour in some, teapot, cup)/task1/observe2/model_1500.pt',
    },
  ]
  expertObservationType: "dofps+dofvel+ftps+lastact+objstate+palmpose+relps"
  